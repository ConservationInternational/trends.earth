name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    env:
      PACKAGED_ZIP: LDMP_security_scan.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y qttools5-dev-tools

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          cache: ''

      - name: Install security tools
        run: pip install bandit detect-secrets flake8

      - name: Build packaged plugin
        run: |
          invoke set-version --modules
          invoke zipfile-build --filename "$PACKAGED_ZIP"

      - name: Run QGIS Plugin Repository security scan
        run: invoke security-scan --filename "$PACKAGED_ZIP"
