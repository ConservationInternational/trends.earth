# Runs tests on supported QGIS 3.x and QGIS 4.x images
name: Continous Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: read

env:
  # Global environment variable
  IMAGE: qgis/qgis
  WITH_PYTHON_PEP: "true"
  MUTE_LOGS: "true"
  SERVICE: qgis-testing-environment

jobs:
  test:
    runs-on: ubuntu-latest
    name: Running tests on QGIS ${{ matrix.qgis_version_tag }}

    strategy:
      fail-fast: false
      matrix:
        qgis_version_tag:
          - 3.44
          - 4.2-trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Preparing docker compose environment
        env:
          QGIS_VERSION_TAG: ${{ matrix.qgis_version_tag }}
        run: |
          cat << EOF > .env
          QGIS_VERSION_TAG=${QGIS_VERSION_TAG}
          IMAGE=${IMAGE}
          ON_TRAVIS=true
          MUTE_LOGS=${MUTE_LOGS}
          WITH_PYTHON_PEP=${WITH_PYTHON_PEP}
          EOF
      - name: Start test stack
        run: |
          set -euxo pipefail
          docker compose build --pull
          docker compose up -d
          # simple wait; replace with healthchecks if available
          sleep 60
          docker compose ps
      - name: Run test suite
        run: |
          set -euxo pipefail
          docker compose exec -T "${SERVICE}" sh -lc 'qgis_testrunner.sh test_suite.test_package'
      - name: Tear down
        if: always()
        run: |
          docker compose logs > docker-compose-logs.txt || true
          docker compose down -v || true
      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs-${{ matrix.qgis_version_tag }}
          path: docker-compose-logs.txt

  # ── Required: marshmallow 4.x ────────────────────────────────────
  test-marshmallow4:
    name: "marshmallow 4 – QGIS ${{ matrix.qgis_version_tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis_version_tag:
          - 3.44
          - 4.2-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Preparing docker compose environment
        env:
          QGIS_VERSION_TAG: ${{ matrix.qgis_version_tag }}
        run: |
          cat << EOF > .env
          QGIS_VERSION_TAG=${QGIS_VERSION_TAG}
          IMAGE=${IMAGE}
          ON_TRAVIS=true
          MUTE_LOGS=${MUTE_LOGS}
          WITH_PYTHON_PEP=${WITH_PYTHON_PEP}
          EOF

      - name: Start test stack
        run: |
          set -euxo pipefail
          docker compose build --pull
          docker compose up -d
          sleep 60
          docker compose ps

      - name: Upgrade marshmallow to 4.x
        run: |
          set -euxo pipefail
          docker compose exec -T "${SERVICE}" sh -lc '
            PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --no-cache-dir "marshmallow>=4.2.2" "marshmallow-dataclass>=8.7.1"
            python3 -c "from importlib.metadata import version; v=version(\"marshmallow\"); print(\"marshmallow\", v); assert int(v.split(\".\")[0]) >= 4"
          '

      - name: Run marshmallow compat tests
        run: |
          set -euxo pipefail
          docker compose exec -T "${SERVICE}" sh -lc '
            cd /tests_directory && python3 -m pytest test/test_marshmallow_compat.py -v --rootdir=/tests_directory --override-ini="pythonpath=test"
          '

      - name: Run full test suite
        run: |
          set -euxo pipefail
          docker compose exec -T "${SERVICE}" sh -lc 'qgis_testrunner.sh test_suite.test_package'

      - name: Tear down
        if: always()
        run: |
          docker compose logs > docker-compose-logs.txt || true
          docker compose down -v || true

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs-marshmallow4-${{ matrix.qgis_version_tag }}
          path: docker-compose-logs.txt
